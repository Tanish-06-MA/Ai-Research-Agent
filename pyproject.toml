[project]
name = "ai-research-agent"
version = "1.0.0"
description = "AI Research Agent with RAG, PDF semantic retrieval, web search, intelligent source routing, and LangGraph workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "groq>=1.5.0",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "pdfplumber>=0.11.10",
    "python-dotenv>=1.1.0",
    "reportlab>=5.0.0",
    "sentence-transformers>=5.7.0",
    "tavily-python>=0.7.26",
]
